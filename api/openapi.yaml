openapi: 3.0.0
info:
  title: Task Management API
  version: 1.0.0
  description: Public API for managing tasks
servers:
  - url: /22030873/miapp/api/public
    description: Production Server
  - url: http://localhost:8080
    description: Local Server
paths:
  /api/tareas:
    get:
      summary: List all tasks
      responses:
        '200':
          description: Array of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tarea'
    post:
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, completada]
              properties:
                titulo:
                  type: string
                completada:
                  type: boolean
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarea'
        '400':
          description: Invalid input
  /api/tareas/{id}:
    get:
      summary: Get a task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarea'
        '404':
          description: Task not found
    put:
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, completada]
              properties:
                titulo:
                  type: string
                completada:
                  type: boolean
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarea'
        '404':
          description: Task not found
        '400':
          description: Invalid input
components:
  schemas:
    Tarea:
      type: object
      required: [id, titulo, completada, fecha_creacion]
      properties:
        id:
          type: integer
          description: Unique identifier
        titulo:
          type: string
          description: Task title
        completada:
          type: boolean
          description: Completion status
        fecha_creacion:
          type: string
          format: date-time
          description: Creation timestamp
